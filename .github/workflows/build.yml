name: Build and release

on:
  push:
    branches: ["**"]
    paths-ignore: ["data/**", "tools/**", "README.md", ".github/workflows/defs.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Scam rules must not fire on ordinary messages
        run: python3 tools/check_rules.py
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Signing key secret is missing"; exit 1; }
          # The secrets were set from Windows, so strip any byte-order mark or line ending first.
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/phoneguard.jks"
          pw=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -cd 'A-Za-z0-9')
          keytool -list -keystore "$RUNNER_TEMP/phoneguard.jks" -storepass "$pw" -alias phoneguard >/dev/null
          {
            echo "storeFile=$RUNNER_TEMP/phoneguard.jks"
            echo "storePassword=$pw"
            echo "keyAlias=phoneguard"
            echo "keyPassword=$pw"
          } > keystore.properties
      - name: Build signed APK
        run: gradle --no-daemon --console=plain assembleRelease
      - name: Package
        id: pkg
        run: |
          vc=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          vn=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/phoneguard.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)" verify dist/phoneguard.apk
          sha=$(sha256sum dist/phoneguard.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","url":"https://github.com/%s/releases/download/v%s/phoneguard.apk","sha256":"%s","published":%s}' \
            "$vc" "$vn" "$GITHUB_REPOSITORY" "$vn" "$sha" "$(date +%s)" > dist/update.json
          echo "vn=$vn" >> "$GITHUB_OUTPUT"
          cat dist/update.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phoneguard-${{ steps.pkg.outputs.vn }}
          path: dist/
      - name: Release when main carries a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.pkg.outputs.vn }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released. Raise versionCode and versionName to publish a new one."
          else
            gh release create "$tag" dist/phoneguard.apk dist/update.json --title "$tag" --notes "PhoneGuard ${{ steps.pkg.outputs.vn }}" --latest
          fi
