name: Threat definitions

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  push:
    branches: [main]
    paths: ["data/**", "tools/build_defs.py", "tools/rulecheck.py", ".github/workflows/defs.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: defs
  cancel-in-progress: false

jobs:
  defs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch vendor indicator repositories
        run: |
          mkdir -p ioc
          for r in eset/malware-ioc DoctorWebLtd/malware-iocs Cisco-Talos/IOCs AmnestyTech/investigations mvt-project/mvt-indicators; do
            git clone -q --depth 1 "https://github.com/$r" "ioc/$(echo "$r" | tr / _)" || echo "could not fetch $r"
          done
      - name: Month stamp
        id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: ClamAV database cache
        id: clam
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: clam
          key: clamav-${{ steps.month.outputs.m }}
      - name: Fetch ClamAV databases
        if: steps.clam.outputs.cache-hit != 'true'
        run: |
          pip install -q cvdupdate
          cvd config set --dbdir "$PWD/clam"
          cvd update || echo "ClamAV not reachable, continuing with the hashes already collected"
      - name: Build definitions
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
        run: python3 tools/build_defs.py out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view defs >/dev/null 2>&1 || gh release create defs --prerelease --title "Threat definitions" \
            --notes "Refreshed every six hours by the definitions workflow. PhoneGuard downloads these files; they are not an app release."
          gh release upload defs out/* --clobber
          cat out/version.txt
