name: Daily threat definitions

on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths: ["data/**", "tools/build_defs.py", ".github/workflows/defs.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: defs
  cancel-in-progress: false

jobs:
  defs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build definitions
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
        run: python3 tools/build_defs.py out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view defs >/dev/null 2>&1 || gh release create defs --prerelease --title "Threat definitions" \
            --notes "Refreshed daily by the definitions workflow. PhoneGuard downloads these files; they are not an app release."
          gh release upload defs out/* --clobber
          cat out/version.txt
